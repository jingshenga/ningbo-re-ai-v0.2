services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.media-upload-uat
    environment:
      NBRE_ADMIN_ALLOWLIST_ENABLED: "true"
      NBRE_ADMIN_ALLOWED_CLIENTS: ${NBRE_UAT_ALLOWED_CLIENTS:-}
      NBRE_MEDIA_UPLOAD_DIR: /data/media-uploads-uat
      NBRE_MEDIA_UPLOAD_MAX_BYTES: "26214400"
      NBRE_MEDIA_UPLOAD_QUOTA_BYTES: "104857600"
      NBRE_MEDIA_PROCESSING_HEADROOM_BYTES: "52428800"
      NBRE_MEDIA_OCR_ENGINE: rapidocr
      NBRE_MEDIA_ASR_ENGINE: auto
      NBRE_MEDIA_KNOWN_COMMUNITIES: 东湖花园
    ports:
      - "${NBRE_UAT_BIND_IP:-127.0.0.1}:${NBRE_UAT_PORT:-18789}:8000"
  worker:
    build:
      context: .
      dockerfile: Dockerfile.media-upload-uat
